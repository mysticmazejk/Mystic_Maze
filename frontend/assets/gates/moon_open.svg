<svg
    xmlns="http://www.w3.org/2000/svg"
    viewBox="0 0 100 100"
>
    <defs>
        <filter
            id="gateShadow"
            x="-20%"
            y="-20%"
            width="140%"
            height="140%"
        >
            <feDropShadow
                dx="0"
                dy="3"
                stdDeviation="2.5"
                flood-color="#000000"
                flood-opacity="0.4"
            />
        </filter>

        <linearGradient
            id="stone"
            x1="0"
            y1="0"
            x2="1"
            y2="1"
        >
            <stop
                offset="0%"
                stop-color="#8a8f9d"
            />
            <stop
                offset="50%"
                stop-color="#666b78"
            />
            <stop
                offset="100%"
                stop-color="#444955"
            />
        </linearGradient>

        <linearGradient
            id="stoneDark"
            x1="0"
            y1="0"
            x2="0"
            y2="1"
        >
            <stop
                offset="0%"
                stop-color="#5e6472"
            />
            <stop
                offset="100%"
                stop-color="#343944"
            />
        </linearGradient>

        <linearGradient
            id="silver"
            x1="0"
            y1="0"
            x2="1"
            y2="1"
        >
            <stop
                offset="0%"
                stop-color="#dce1eb"
            />
            <stop
                offset="50%"
                stop-color="#aab3c2"
            />
            <stop
                offset="100%"
                stop-color="#768092"
            />
        </linearGradient>

        <radialGradient
            id="moonGlow"
            cx="50%"
            cy="50%"
            r="50%"
        >
            <stop
                offset="0%"
                stop-color="#d8d8ff"
                stop-opacity="0.85"
            />
            <stop
                offset="55%"
                stop-color="#8f85db"
                stop-opacity="0.45"
            />
            <stop
                offset="100%"
                stop-color="#564f9e"
                stop-opacity="0"
            />
        </radialGradient>
    </defs>

    <g filter="url(#gateShadow)">

        <!-- Seitliche Steinpfeiler -->
        <rect
            x="9"
            y="24"
            width="13"
            height="67"
            rx="2"
            fill="url(#stone)"
            stroke="#313642"
            stroke-width="2.2"
        />

        <rect
            x="78"
            y="24"
            width="13"
            height="67"
            rx="2"
            fill="url(#stone)"
            stroke="#313642"
            stroke-width="2.2"
        />

        <!-- Steinerner Bogen -->
        <path
            d="M8 30
               Q50 8 92 30
               L88 42
               Q50 22 12 42
               Z"
            fill="url(#stone)"
            stroke="#313642"
            stroke-width="2.5"
        />

        <!-- Steintextur -->
        <path
            d="M17 34
               Q50 18 83 34"
            fill="none"
            stroke="#a0a7b6"
            stroke-width="2"
            opacity="0.35"
        />

        <!-- Geöffneter linker Flügel -->
        <path
            d="M22 36
               L39 42
               L39 83
               L22 88
               Z"
            fill="url(#stoneDark)"
            stroke="#2a2f3a"
            stroke-width="2.2"
        />

        <!-- Fugen links -->
        <path
            d="M28 38 L29 86
               M34 40 L35 84
               M23 52 L39 56
               M22 70 L39 70"
            stroke="#7d8595"
            stroke-width="1.3"
            opacity="0.35"
        />

        <!-- Silberne Beschläge links -->
        <path
            d="M22 50 L39 54"
            stroke="url(#silver)"
            stroke-width="5"
            stroke-linecap="round"
        />

        <path
            d="M22 70 L39 70"
            stroke="url(#silver)"
            stroke-width="5"
            stroke-linecap="round"
        />

        <!-- Geöffneter rechter Flügel -->
        <path
            d="M78 36
               L61 42
               L61 83
               L78 88
               Z"
            fill="url(#stoneDark)"
            stroke="#2a2f3a"
            stroke-width="2.2"
        />

        <!-- Fugen rechts -->
        <path
            d="M72 38 L71 86
               M66 40 L65 84
               M61 56 L77 52
               M61 70 L78 70"
            stroke="#7d8595"
            stroke-width="1.3"
            opacity="0.35"
        />

        <!-- Silberne Beschläge rechts -->
        <path
            d="M78 50 L61 54"
            stroke="url(#silver)"
            stroke-width="5"
            stroke-linecap="round"
        />

        <path
            d="M78 70 L61 70"
            stroke="url(#silver)"
            stroke-width="5"
            stroke-linecap="round"
        />

        <!-- Dunkler Durchgang -->
        <path
            d="M40 40
               Q50 31 60 40
               L60 88
               L40 88
               Z"
            fill="#171a24"
            opacity="0.78"
        />

        <!-- Leichter magischer Schimmer im Durchgang -->
        <path
            d="M44 46
               Q50 41 56 46
               L56 82
               L44 82
               Z"
            fill="#6156b7"
            opacity="0.18"
        />

        <!-- Mond-Ornament Glow -->
        <circle
            cx="50"
            cy="42"
            r="13"
            fill="url(#moonGlow)"
            opacity="0.9"
        />

        <!-- Mond-Ornament -->
        <path
            d="M54 32
               C48 33, 44 38, 44 44
               C44 50, 48 55, 54 56
               C49 53, 46 49, 46 44
               C46 39, 49 35, 54 32 Z"
            fill="#dfe4f2"
            stroke="#9fa9c1"
            stroke-width="1.3"
        />

        <!-- Blau-violette Akzente -->
        <circle
            cx="27"
            cy="29"
            r="2.3"
            fill="#8e7fe0"
            opacity="0.85"
        />

        <circle
            cx="73"
            cy="29"
            r="2.3"
            fill="#8e7fe0"
            opacity="0.85"
        />

        <circle
            cx="18"
            cy="81"
            r="2"
            fill="#7a6fd1"
            opacity="0.65"
        />

        <circle
            cx="82"
            cy="81"
            r="2"
            fill="#7a6fd1"
            opacity="0.65"
        />
    </g>
</svg>