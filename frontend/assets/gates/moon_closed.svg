<svg
    xmlns="http://www.w3.org/2000/svg"
    viewBox="0 0 100 100"
>
    <defs>
        <filter
            id="gateShadow"
            x="-20%"
            y="-20%"
            width="140%"
            height="140%"
        >
            <feDropShadow
                dx="0"
                dy="3"
                stdDeviation="2.5"
                flood-color="#000000"
                flood-opacity="0.4"
            />
        </filter>

        <linearGradient
            id="stone"
            x1="0"
            y1="0"
            x2="1"
            y2="1"
        >
            <stop
                offset="0%"
                stop-color="#8a8f9d"
            />
            <stop
                offset="50%"
                stop-color="#666b78"
            />
            <stop
                offset="100%"
                stop-color="#444955"
            />
        </linearGradient>

        <linearGradient
            id="stoneDark"
            x1="0"
            y1="0"
            x2="0"
            y2="1"
        >
            <stop
                offset="0%"
                stop-color="#5e6472"
            />
            <stop
                offset="100%"
                stop-color="#343944"
            />
        </linearGradient>

        <linearGradient
            id="silver"
            x1="0"
            y1="0"
            x2="1"
            y2="1"
        >
            <stop
                offset="0%"
                stop-color="#dce1eb"
            />
            <stop
                offset="50%"
                stop-color="#aab3c2"
            />
            <stop
                offset="100%"
                stop-color="#768092"
            />
        </linearGradient>

        <radialGradient
            id="moonGlow"
            cx="50%"
            cy="50%"
            r="50%"
        >
            <stop
                offset="0%"
                stop-color="#d8d8ff"
                stop-opacity="0.85"
            />
            <stop
                offset="55%"
                stop-color="#8f85db"
                stop-opacity="0.45"
            />
            <stop
                offset="100%"
                stop-color="#564f9e"
                stop-opacity="0"
            />
        </radialGradient>
    </defs>

    <g filter="url(#gateShadow)">

        <!-- Seitliche Steinpfeiler -->
        <rect
            x="9"
            y="24"
            width="13"
            height="67"
            rx="2"
            fill="url(#stone)"
            stroke="#313642"
            stroke-width="2.2"
        />

        <rect
            x="78"
            y="24"
            width="13"
            height="67"
            rx="2"
            fill="url(#stone)"
            stroke="#313642"
            stroke-width="2.2"
        />

        <!-- Steinerner Bogen -->
        <path
            d="M8 30
               Q50 8 92 30
               L88 42
               Q50 22 12 42
               Z"
            fill="url(#stone)"
            stroke="#313642"
            stroke-width="2.5"
        />

        <!-- Steintextur Bogen -->
        <path
            d="M17 34
               Q50 18 83 34"
            fill="none"
            stroke="#a0a7b6"
            stroke-width="2"
            opacity="0.35"
        />

        <!-- Linker Torflügel -->
        <path
            d="M22 35
               Q35 30 49 31
               L49 88
               L22 88
               Z"
            fill="url(#stoneDark)"
            stroke="#2a2f3a"
            stroke-width="2.2"
        />

        <!-- Rechter Torflügel -->
        <path
            d="M51 31
               Q65 30 78 35
               L78 88
               L51 88
               Z"
            fill="url(#stoneDark)"
            stroke="#2a2f3a"
            stroke-width="2.2"
        />

        <!-- Fugen / Steinplatten links -->
        <path
            d="M31 35 V88
               M40 33 V88
               M22 52 H49
               M22 70 H49"
            stroke="#7d8595"
            stroke-width="1.5"
            opacity="0.35"
        />

        <!-- Fugen / Steinplatten rechts -->
        <path
            d="M60 33 V88
               M69 35 V88
               M51 52 H78
               M51 70 H78"
            stroke="#7d8595"
            stroke-width="1.5"
            opacity="0.35"
        />

        <!-- Silberne Beschläge -->
        <rect
            x="21"
            y="48"
            width="28"
            height="5"
            rx="2"
            fill="url(#silver)"
        />

        <rect
            x="21"
            y="69"
            width="28"
            height="5"
            rx="2"
            fill="url(#silver)"
        />

        <rect
            x="51"
            y="48"
            width="28"
            height="5"
            rx="2"
            fill="url(#silver)"
        />

        <rect
            x="51"
            y="69"
            width="28"
            height="5"
            rx="2"
            fill="url(#silver)"
        />

        <!-- Zentrales Schloss -->
        <rect
            x="45"
            y="57"
            width="10"
            height="14"
            rx="2"
            fill="#474f5e"
            stroke="#c3cada"
            stroke-width="1.4"
        />

        <circle
            cx="50"
            cy="62"
            r="2.1"
            fill="#dfe5ef"
        />

        <!-- Mond-Ornament Glow -->
        <circle
            cx="50"
            cy="42"
            r="13"
            fill="url(#moonGlow)"
            opacity="0.9"
        />

        <!-- Mond-Ornament -->
        <path
            d="M54 32
               C48 33, 44 38, 44 44
               C44 50, 48 55, 54 56
               C49 53, 46 49, 46 44
               C46 39, 49 35, 54 32 Z"
            fill="#dfe4f2"
            stroke="#9fa9c1"
            stroke-width="1.3"
        />

        <!-- Kleine violette Runensteine / Akzente -->
        <circle
            cx="27"
            cy="29"
            r="2.3"
            fill="#8e7fe0"
            opacity="0.85"
        />

        <circle
            cx="73"
            cy="29"
            r="2.3"
            fill="#8e7fe0"
            opacity="0.85"
        />

        <circle
            cx="18"
            cy="81"
            r="2"
            fill="#7a6fd1"
            opacity="0.65"
        />

        <circle
            cx="82"
            cy="81"
            r="2"
            fill="#7a6fd1"
            opacity="0.65"
        />
    </g>
</svg>