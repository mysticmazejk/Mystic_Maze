<svg
    xmlns="http://www.w3.org/2000/svg"
    viewBox="0 0 100 100"
>
    <defs>
        <filter
            id="gateShadow"
            x="-20%"
            y="-20%"
            width="140%"
            height="140%"
        >
            <feDropShadow
                dx="0"
                dy="3"
                stdDeviation="2.5"
                flood-color="#000000"
                flood-opacity="0.4"
            />
        </filter>

        <linearGradient
            id="wood"
            x1="0"
            y1="0"
            x2="1"
            y2="1"
        >
            <stop
                offset="0%"
                stop-color="#765130"
            />
            <stop
                offset="50%"
                stop-color="#56391f"
            />
            <stop
                offset="100%"
                stop-color="#382516"
            />
        </linearGradient>

        <linearGradient
            id="iron"
            x1="0"
            y1="0"
            x2="1"
            y2="1"
        >
            <stop
                offset="0%"
                stop-color="#66625a"
            />
            <stop
                offset="100%"
                stop-color="#272622"
            />
        </linearGradient>
    </defs>

    <g filter="url(#gateShadow)">

        <!-- Seitliche schwere Holzpfosten -->
        <rect
            x="10"
            y="23"
            width="12"
            height="68"
            rx="3"
            fill="#3c2918"
        />

        <rect
            x="78"
            y="23"
            width="12"
            height="68"
            rx="3"
            fill="#3c2918"
        />

        <!-- Oberer mittelalterlicher Querbalken -->
        <path
            d="M8 29
               Q50 8 92 29
               L87 40
               Q50 23 13 40
               Z"
            fill="#47301c"
            stroke="#281b10"
            stroke-width="3"
        />

        <!-- Linker Torflügel -->
        <path
            d="M21 35
               Q35 29 49 31
               L49 88
               L21 88
               Z"
            fill="url(#wood)"
            stroke="#2d1d11"
            stroke-width="2.5"
        />

        <!-- Rechter Torflügel -->
        <path
            d="M51 31
               Q65 29 79 35
               L79 88
               L51 88
               Z"
            fill="url(#wood)"
            stroke="#2d1d11"
            stroke-width="2.5"
        />

        <!-- Holzbretter links -->
        <path
            d="M30 34 V87
               M40 32 V87"
            stroke="#362315"
            stroke-width="2"
            opacity="0.8"
        />

        <!-- Holzbretter rechts -->
        <path
            d="M60 32 V87
               M70 34 V87"
            stroke="#362315"
            stroke-width="2"
            opacity="0.8"
        />

        <!-- Eisenbeschläge -->
        <rect
            x="20"
            y="49"
            width="29"
            height="5"
            rx="2"
            fill="url(#iron)"
        />

        <rect
            x="51"
            y="49"
            width="29"
            height="5"
            rx="2"
            fill="url(#iron)"
        />

        <rect
            x="20"
            y="71"
            width="29"
            height="5"
            rx="2"
            fill="url(#iron)"
        />

        <rect
            x="51"
            y="71"
            width="29"
            height="5"
            rx="2"
            fill="url(#iron)"
        />

        <!-- Zentrales Schloss -->
        <rect
            x="45"
            y="57"
            width="10"
            height="14"
            rx="2"
            fill="#292823"
            stroke="#817763"
            stroke-width="1.5"
        />

        <circle
            cx="50"
            cy="62"
            r="2.2"
            fill="#b89b5e"
        />

        <!-- Linke Ranke -->
        <path
            d="M13 73
               C4 63, 17 55, 11 47
               C6 40, 17 33, 14 26"
            fill="none"
            stroke="#385b32"
            stroke-width="4"
            stroke-linecap="round"
        />

        <!-- Rechte Ranke -->
        <path
            d="M87 72
               C96 63, 83 54, 89 46
               C94 39, 83 33, 87 24"
            fill="none"
            stroke="#385b32"
            stroke-width="4"
            stroke-linecap="round"
        />

        <!-- Blätter links -->
        <g
            fill="#5f8e4e"
            stroke="#29472a"
            stroke-width="1.2"
        >
            <ellipse
                cx="11"
                cy="63"
                rx="5"
                ry="8"
                transform="rotate(-38 11 63)"
            />

            <ellipse
                cx="16"
                cy="52"
                rx="5"
                ry="8"
                transform="rotate(38 16 52)"
            />

            <ellipse
                cx="10"
                cy="39"
                rx="5"
                ry="8"
                transform="rotate(-32 10 39)"
            />

            <ellipse
                cx="19"
                cy="29"
                rx="5"
                ry="8"
                transform="rotate(45 19 29)"
            />
        </g>

        <!-- Blätter rechts -->
        <g
            fill="#668f50"
            stroke="#29472a"
            stroke-width="1.2"
        >
            <ellipse
                cx="89"
                cy="63"
                rx="5"
                ry="8"
                transform="rotate(38 89 63)"
            />

            <ellipse
                cx="84"
                cy="52"
                rx="5"
                ry="8"
                transform="rotate(-38 84 52)"
            />

            <ellipse
                cx="90"
                cy="39"
                rx="5"
                ry="8"
                transform="rotate(32 90 39)"
            />

            <ellipse
                cx="81"
                cy="29"
                rx="5"
                ry="8"
                transform="rotate(-45 81 29)"
            />
        </g>

        <!-- Blätter über dem Torbogen -->
        <g
            fill="#759d5d"
            stroke="#29472a"
            stroke-width="1.1"
        >
            <ellipse
                cx="30"
                cy="21"
                rx="5"
                ry="8"
                transform="rotate(-55 30 21)"
            />

            <ellipse
                cx="41"
                cy="17"
                rx="5"
                ry="8"
                transform="rotate(-22 41 17)"
            />

            <ellipse
                cx="54"
                cy="17"
                rx="5"
                ry="8"
                transform="rotate(18 54 17)"
            />

            <ellipse
                cx="67"
                cy="21"
                rx="5"
                ry="8"
                transform="rotate(53 67 21)"
            />
        </g>
    </g>
</svg>